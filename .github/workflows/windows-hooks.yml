name: Windows hook shell regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-hooks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: npm ci
      - name: Confirm native Node architecture
        env:
          HONGGUO_EXPECT_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch!==process.env.HONGGUO_EXPECT_ARCH)process.exit(1);console.log('Node architecture:',process.arch)"
      - name: Build native launchers and hook program
        run: npm run build
      - name: Verify hooks through CMD and both PowerShell versions
        run: node --test --test-timeout=120000 test/windows-hooks-shell.test.mjs
      - name: Verify a single Node process per hook
        run: node --test --test-timeout=120000 --test-name-pattern="Windows turn-start hook" test/windows.test.mjs
  baseline-mcp:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b5ab142
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: npm ci
        working-directory: baseline
      - run: npm run build
        working-directory: baseline
      - name: Identify whether MCP shutdown failure predates this patch
        run: node scripts/check-windows-mcp-baseline.mjs baseline
