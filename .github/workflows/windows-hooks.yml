name: Windows hook shell regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: npm ci
      - name: Build native launchers and hook program
        run: npm run build
      - name: Verify hooks through CMD and both PowerShell versions
        run: node --test --test-timeout=120000 test/windows.test.mjs test/windows-hooks-shell.test.mjs
