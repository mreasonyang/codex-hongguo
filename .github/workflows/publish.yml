name: Publish
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install tools
        run: |
          npm install --global npm@11 @openai/codex@0.157.1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npm run verify:install
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-release
          path: |
            release/*.tgz
            release/*.zip
            release/verification.json
      - name: Publish through npm trusted publishing
        run: npm run release:publish -- --provenance
      - name: Advance the npm version index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/plugins/marketplace.json README.md README.en.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update published npm plugin index'
            git push origin HEAD:main
          fi
