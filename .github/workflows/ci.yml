name: Openhongguo current live self-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: beilunyang/openhongguo
          ref: 42b73f201309423f012d483bfc0ce579dcc0937c
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install frame decoder
        run: sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null 2>&1
      - name: Run the unmodified upstream live self-check
        env:
          DIAGNOSTIC_OUT: ${{ runner.temp }}/selfcheck-result
        run: |
          python3 - <<'PYCODE'
          import datetime,json,os,pathlib,re,subprocess,sys
          result={'sourceCommit':'42b73f201309423f012d483bfc0ce579dcc0937c','platform':'ubuntu-latest','freshGuest':True,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          p=subprocess.run(['go','test','-json','-count=1','-tags','live','-run','TestLiveContract','./internal/contract'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=230)
          checks=[];actions=[];frame_skipped=False
          for line in p.stdout.decode(errors='replace').splitlines():
            try:e=json.loads(line)
            except ValueError:continue
            if e.get('Test')=='TestLiveContract' and e.get('Action') in ['pass','fail','skip']:actions.append(e['Action'])
            s=e.get('Output','')
            hit=re.match(r'\s*([a-z ]+?)\s{2,}(ok|FAIL)(?:\s|$)',s)
            if hit:checks.append({'check':hit.group(1).strip(),'status':hit.group(2)})
            if 'ffmpeg not found' in s:frame_skipped=True
          result.update(exitCode=p.returncode,checks=checks,testActions=actions,frameDecodeSkipped=frame_skipped,stderrBytes=len(p.stderr))
          out=pathlib.Path(os.environ['DIAGNOSTIC_OUT']);out.mkdir(parents=True,exist_ok=True)
          (out/'report.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          sys.exit(p.returncode or int(frame_skipped))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openhongguo-current-live-selfcheck
          path: ${{ runner.temp }}/selfcheck-result/report.json
          if-no-files-found: ignore
